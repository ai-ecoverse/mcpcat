name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-ci.yml@v1.13.1
    with:
      node-version: '24'
      chromium: false

  cert:
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        kernel:
          - '@ai-ecoverse/slicc-kernel@1.65.2'
          - '@ai-ecoverse/slicc-kernel@1.76.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Run cert with kernel ${{ matrix.kernel }}
        run: |
          OUTPUT=$(npm run cert -- '--kernel=${{ matrix.kernel }}' 2>&1) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q 'cert: kernel'
          PASS_COUNT=$(echo "$OUTPUT" | grep -oP 'pass \K\d+' | tail -1)
          echo "pass count: $PASS_COUNT"
          test "$PASS_COUNT" -gt 0
        env:
          NODE_NO_WARNINGS: '1'
