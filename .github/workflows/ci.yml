name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FORCED: ${{ vars.CI_RUNNER }}
          POOL: ${{ vars.CERT_RUNNER || 'cloud-run-bench' }}
        with:
          script: |
            const hosted = 'ubuntu-latest';
            const pick = async (runner, why) => {
              core.setOutput('runner', runner);
              await core.summary.addRaw(`runner: ${runner} (${why})\n`).write();
            };
            if (process.env.FORCED) return await pick(process.env.FORCED, 'vars.CI_RUNNER');
            const pool = process.env.POOL;
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const head = context.payload.pull_request.head.repo;
              const same = head && head.full_name === `${owner}/${repo}`;
              return same ? await pick(pool, 'same-repo PR') : await pick(hosted, 'fork PR');
            }
            if (context.eventName === 'merge_group') {
              const base = context.payload.merge_group.base_ref.replace('refs/heads/', '');
              const q = await github.graphql(
                `query($o:String!,$n:String!,$b:String!){repository(owner:$o,name:$n){mergeQueue(branch:$b){entries(first:100){nodes{pullRequest{number isCrossRepository}}}}}}`,
                { o: owner, n: repo, b: base }
              );
              const entries = q.repository.mergeQueue?.entries?.nodes ?? [];
              const forks = entries.filter((e) => e.pullRequest?.isCrossRepository !== false);
              return forks.length === 0
                ? await pick(pool, `merge group, ${entries.length} same-repo entries`)
                : await pick(hosted, `merge group with a fork or unknown PR: ${forks.map((e) => e.pullRequest?.number).join(', ')}`);
            }
            await pick(hosted, context.eventName);

  ci:
    needs: runner
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-ci.yml@v1.20.0
    with:
      runs-on: ${{ needs.runner.outputs.runner }}
      node-version: '24'
      chromium: false
      timeout-minutes: 60
      test: |
        set -u
        mkdir -p /tmp/k181 && (cd /tmp/k181 && npm init -y >/dev/null && npm install @ai-ecoverse/slicc-kernel@1.81.0 >/dev/null)
        K181=/tmp/k181/node_modules/@ai-ecoverse/slicc-kernel
        fails=0; runs=0
        for i in $(seq 1 5); do
          runs=$((runs+1)); npm run test:integration > /tmp/full-$i.log 2>&1 || { fails=$((fails+1)); grep -E "^✖|AssertionError" /tmp/full-$i.log | head -20; }
        done
        echo "full suite on 1.94.2: $fails failures in $runs runs"
        for k in default 181; do
          f=0
          for i in $(seq 1 20); do
            if [ $k = 181 ]; then export MCPCAT_CERT_KERNEL_DIR=$K181; else unset MCPCAT_CERT_KERNEL_DIR; fi
            node --test --test-timeout=60000 test/integration/serve-signal-cleanup.test.mjs test/integration/lifecycle.test.mjs > /tmp/pair-$k-$i.log 2>&1 || { f=$((f+1)); grep -E "^✖|AssertionError|!==" /tmp/pair-$k-$i.log | head -10; }
          done
          echo "serve-signal-cleanup + lifecycle on kernel $k: $f failures in 20 runs"
        done

  cert:
    runs-on: ${{ needs.runner.outputs.runner }}
    needs: runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Run cert with the kernel slicc-bios ships
        run: |
          kernel=$(node -p "require('@ai-ecoverse/slicc-bios/src/packages/package.json').dependencies['@ai-ecoverse/slicc-kernel']")
          agent=$(node -p "require('@ai-ecoverse/slicc-bios/src/packages/agent/package.json').peerDependencies?.['@ai-ecoverse/slicc-kernel'] ?? require('@ai-ecoverse/slicc-bios/src/packages/agent/package.json').dependencies?.['@ai-ecoverse/slicc-kernel'] ?? ''")
          [ -z "$agent" ] || [ "$agent" = "$kernel" ]
          echo "slicc-bios ships slicc-kernel $kernel"
          npm run cert -- "--kernel=@ai-ecoverse/slicc-kernel@$kernel"
        env:
          NODE_NO_WARNINGS: '1'

  all-green:
    if: always()
    needs: [runner, ci, cert]
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    steps:
      - run: '[ "${{ needs.runner.result }}" = success ] && [ "${{ needs.ci.result }}" = success ] && [ "${{ needs.cert.result }}" = success ]'
