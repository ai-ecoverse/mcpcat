name: ci

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-ci.yml@v1.14.0
    with:
      node-version: '24'
      chromium: false

  cert:
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        kernel:
          - '@ai-ecoverse/slicc-kernel@1.65.2'
          - '@ai-ecoverse/slicc-kernel@1.76.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Run cert with kernel ${{ matrix.kernel }}
        run: npm run cert -- '--kernel=${{ matrix.kernel }}'
        env:
          NODE_NO_WARNINGS: '1'

  all-green:
    if: always()
    needs: [ci, cert]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.ci.result }}" = success ] && [ "${{ needs.cert.result }}" = success ]'
