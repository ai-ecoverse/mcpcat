name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  attestations: write
  issues: write
  pull-requests: write
  statuses: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/pipeline.yml@v2.13.2
    secrets: inherit
    with:
      node-version: '26'
      test-glob: test/integration/*.test.mjs
      shards: 4
      timeout-minutes: 30
      review-timeout-minutes: 90
      review-prompt: |
        MCPCAT

        This repository is mcpcat (`@ai-ecoverse/mcpcat`): a curl for the Model Context Protocol. One npm package ships two bundles built by esbuild from `src/`: `dist/host/mcpcat.mjs`, the Node bin, and `dist/kernel/mcpcat.mjs`, a self-contained `abi: "js"` program that slicc-kernel runs inside Sliccy Seven, plus `install.sh` on the GitHub release. `docs/spec.html` and the README are the contract: read the sections the change touches first. `git diff origin/main...HEAD`, or `$RUNNER_TEMP/review/context/pr.diff`, is the change.

        There is no certification after you: once this pull request passes the merge queue, semantic-release publishes it to npm from `main`, and the installer and seven's catalog pick it up. Review it as the last check before it ships.

        Look for real defects, in this order:
        1. Secrets: a token, a `${VAR}` header value, an OAuth code or refresh token or a bearer never reaches stdout, stderr, `-v` traces, argv, `mcp.json`, error messages or a served child's environment; the token store stays 0600 in a 0700 directory; `serve` and `--proxy` bind loopback, check the bearer, `Origin` and `Host`, send no CORS and never forward the caller's `Authorization`; discovery follows no link, redirect or advertised endpoint to another origin or a private address.
        2. Code mode: scripts in the QuickJS VM reach tools and nothing else (no fetch, fs, timers, process, import) unless `--allow-shell`, and memory and deadline limits hold.
        3. Host and kernel parity: the same flags, output, JSON and exit codes on the host and in the kernel, on every slicc-kernel from `engines.slicc-kernel` up; the kernel bundle has no imports and uses only `ctx.*`.
        4. Processes: SIGINT, SIGTERM and timeouts end stdio server trees and served commands with no orphans, release auth locks and exit with the documented codes; promises that never settle, and races between calls sharing one refresh.
        5. Tests: every behaviour change has an integration test in `test/integration/`, and a fix's test fails without the fix. Confirm that for a fix: copy the changed test files into `$RUNNER_TEMP/base`, build it and run them there.
        6. Repo rules: no comments anywhere (YAML too, except `# renovate:` annotations), no unit tests in git, AGENTS.md at most 1,000 characters, and a conventional-commit title (`fix`, `feat` and `perf` release, the rest don't).

        `npm ci` builds `dist/` through `prepare`; run `npm run build` after you change a tree. Run one test file with `node --test --test-timeout=30000 test/integration/<file>.test.mjs`. The review browsers aren't used by this repository. Don't report style preferences, or anything you haven't confirmed in the code or by a run.

        Severity: deny for a confirmed P1 or P2: a secret exposure, a serve or proxy bypass, a code-mode escape, a crash or a command that no longer runs in the kernel, a regression in a common command without a workaround, a behaviour change without its test, or a fix whose test passes without it. A narrow problem with a workaround is P3: comment with a repro and approve. A problem in the kernel belongs to ai-ecoverse/slicc-kernel, one in seven's catalog to ai-ecoverse/slicc-bios: open it there as an issue.

  released:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: version
        run: |
          git fetch --tags --force --quiet origin
          version=$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1 || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release: ${version:-none} at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    needs: released
    if: needs.released.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.released.outputs.version }}
      TAG: v${{ needs.released.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      # renovate: datasource=docker depName=alpine
      ALPINE_IMAGE: alpine:3.24.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'

      - name: Shellcheck
        run: shellcheck -s sh install.sh test/integration/test-install.sh test/integration/hide-node.sh

      - name: Fetch the published npm tarball
        run: |
          mkdir assets
          for _ in $(seq 1 90); do
            npm pack "@ai-ecoverse/mcpcat@$VERSION" --pack-destination assets && break
            sleep 10
          done
          [ -f "assets/ai-ecoverse-mcpcat-$VERSION.tgz" ] || { echo "npm pack: @ai-ecoverse/mcpcat@$VERSION not fetchable after 90 attempts"; exit 1; }
          mv "assets/ai-ecoverse-mcpcat-$VERSION.tgz" "assets/mcpcat-$VERSION.tgz"
          cd assets && sha256sum "mcpcat-$VERSION.tgz" | tee SHA256SUMS

      - name: Installer test, alpine with nodejs
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e VERSION -e EXPECT_MANAGED_NODE=0 "$ALPINE_IMAGE" sh -euc '
            apk add --no-cache python3 tar xz nodejs-current >/dev/null
            sh test/integration/test-install.sh assets "$VERSION"
          ' 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -qx 'All installer tests passed.' "$RUNNER_TEMP/install.log" || { echo "installer: FAIL, test-install.sh printed no verdict"; exit 1; }

      - name: Installer test, alpine with a node below engines.node
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$ALPINE_IMAGE" sh -euc '
            apk add --no-cache nodejs >/dev/null
            floor="$(sed -n "s/.*\"node\": *\">=\([0-9][0-9]*\)\".*/\1/p" package.json | head -1)"
            major="$(node --version | sed "s/^v//" | cut -d. -f1)"
            [ "$major" -lt "$floor" ] || { echo "SKIP: apk nodejs $major is not below $floor"; exit 0; }
            if SLICC_INSTALL_BASE_URL="http://dummy" sh install.sh 2>/tmp/err.txt; then
              echo "FAIL: accepted node $major below engines.node $floor" >&2
              exit 1
            fi
            grep -q "apk add nodejs-current" /tmp/err.txt || { echo "FAIL: expected apk hint" >&2; cat /tmp/err.txt >&2; exit 1; }
            echo "OK: node $major rejected below $floor"
          '

      - name: Installer test, alpine without node (musl rejection)
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$ALPINE_IMAGE" sh -euc '
            if SLICC_INSTALL_BASE_URL="http://dummy" sh install.sh 2>/tmp/err.txt; then
              echo "FAIL: should have exited 1 on musl without node" >&2
              exit 1
            fi
            grep -q "apk add nodejs-current" /tmp/err.txt || { echo "FAIL: expected apk hint" >&2; cat /tmp/err.txt >&2; exit 1; }
            echo "OK: musl rejection message shown"
          '

      - name: Installer test, ubuntu with node
        env:
          EXPECT_MANAGED_NODE: '0'
        run: |
          sh test/integration/test-install.sh assets "$VERSION" 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -qx 'All installer tests passed.' "$RUNNER_TEMP/install.log" || { echo "installer: FAIL, test-install.sh printed no verdict"; exit 1; }

      - name: Hide system node
        run: sh test/integration/hide-node.sh

      - name: Installer test, ubuntu without node
        env:
          EXPECT_MANAGED_NODE: '1'
        run: |
          sh test/integration/test-install.sh assets "$VERSION" 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -qx 'All installer tests passed.' "$RUNNER_TEMP/install.log" || { echo "installer: FAIL, test-install.sh printed no verdict"; exit 1; }

      - name: Attach the assets to the GitHub release
        run: |
          cp install.sh assets/
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag --prerelease
          fi

      - name: Promote to latest if highest semver with assets
        run: |
          highest=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.assets | length > 1) | select(.prerelease | not) | select(.draft | not) | .tag_name | ltrimstr("v")] + ["'"$VERSION"'"] | sort_by(split(".") | map(tonumber)) | last')
          if [ "$highest" = "$VERSION" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          fi

      - name: Keep a failed release as a prerelease
        if: failure()
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Installer assets failed to build. See the workflow run." --verify-tag --prerelease
          fi
