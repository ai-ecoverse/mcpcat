name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-ci.yml@v1.13.1
    with:
      node-version: '24'
      chromium: false

  cert:
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        kernel:
          - '@ai-ecoverse/slicc-kernel@1.65.2'
          - '@ai-ecoverse/slicc-kernel@1.76.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Run cert with kernel ${{ matrix.kernel }}
        run: npm run cert -- '--kernel=${{ matrix.kernel }}'
        env:
          NODE_NO_WARNINGS: '1'
