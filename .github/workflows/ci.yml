name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FORCED: ${{ vars.CI_RUNNER }}
          POOL: ${{ vars.CERT_RUNNER }}
        with:
          script: |
            const hosted = 'ubuntu-latest';
            const pick = async (runner, why) => {
              core.setOutput('runner', runner);
              await core.summary.addRaw(`runner: ${runner} (${why})\n`).write();
            };
            if (process.env.FORCED) return await pick(process.env.FORCED, 'vars.CI_RUNNER');
            const pool = process.env.POOL;
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const head = context.payload.pull_request.head.repo;
              const same = head && head.full_name === `${owner}/${repo}`;
              return same ? await pick(pool, 'same-repo PR') : await pick(hosted, 'fork PR');
            }
            if (context.eventName === 'merge_group') {
              const base = context.payload.merge_group.base_ref.replace('refs/heads/', '');
              const q = await github.graphql(
                `query($o:String!,$n:String!,$b:String!){repository(owner:$o,name:$n){mergeQueue(branch:$b){entries(first:100){nodes{pullRequest{number isCrossRepository}}}}}}`,
                { o: owner, n: repo, b: base }
              );
              const entries = q.repository.mergeQueue?.entries?.nodes ?? [];
              const forks = entries.filter((e) => e.pullRequest?.isCrossRepository !== false);
              return forks.length === 0
                ? await pick(pool, `merge group, ${entries.length} same-repo entries`)
                : await pick(hosted, `merge group with a fork or unknown PR: ${forks.map((e) => e.pullRequest?.number).join(', ')}`);
            }
            await pick(hosted, context.eventName);

  ci:
    needs: runner
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-ci.yml@v1.29.3
    with:
      runs-on: ${{ needs.runner.outputs.runner }}
      # renovate: datasource=node-version depName=node versioning=node
      node-version: '26'
      chromium: false

  cert:
    runs-on: ${{ needs.runner.outputs.runner }}
    needs: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # renovate: datasource=node-version depName=node versioning=node
          node-version: '26'
      - run: npm ci
      - name: Run cert with the kernel slicc-bios ships
        run: |
          kernel=$(node -p "require('@ai-ecoverse/slicc-bios/src/packages/package.json').dependencies['@ai-ecoverse/slicc-kernel']")
          agent=$(node -p "require('@ai-ecoverse/slicc-bios/src/packages/agent/package.json').peerDependencies?.['@ai-ecoverse/slicc-kernel'] ?? require('@ai-ecoverse/slicc-bios/src/packages/agent/package.json').dependencies?.['@ai-ecoverse/slicc-kernel'] ?? ''")
          [ -z "$agent" ] || [ "$agent" = "$kernel" ]
          echo "slicc-bios ships slicc-kernel $kernel"
          set -o pipefail
          npm run cert -- "--kernel=@ai-ecoverse/slicc-kernel@$kernel" 2>&1 | tee "$RUNNER_TEMP/cert.log"
          verdict=$(grep -E "^cert: kernel $kernel — [1-9][0-9]* kernel tests passed$" "$RUNNER_TEMP/cert.log" | tail -1 || true)
          if [ -z "$verdict" ]; then
            echo "cert: FAIL — cert printed no passing verdict for slicc-kernel $kernel"
            exit 1
          fi
          echo "cert: PASS — $verdict"
        env:
          NODE_NO_WARNINGS: '1'

  cert-review:
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/cert-review.yml
    secrets: inherit

  all-green:
    if: always()
    needs: [runner, ci, cert, cert-review]
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: The verdict the merge queue requires
        env:
          RUNNER_RESULT: ${{ needs.runner.result }}
          CI_RESULT: ${{ needs.ci.result }}
          CERT_RESULT: ${{ needs.cert.result }}
          REVIEW_RESULT: ${{ needs.cert-review.result }}
          VERDICT: ${{ needs.cert-review.outputs.verdict }}
        run: |
          line="runner=${RUNNER_RESULT:-none} ci=${CI_RESULT:-none} cert=${CERT_RESULT:-none} cert-review=${REVIEW_RESULT:-none} (${VERDICT:-no verdict})"
          ok=true
          for r in "$RUNNER_RESULT" "$CI_RESULT" "$CERT_RESULT" "$REVIEW_RESULT"; do [ "$r" = success ] || ok=false; done
          case "$VERDICT" in certified | not-behaviour | none) ;; *) ok=false ;; esac
          if [ "$ok" = true ]; then
            echo "all-green: PASS $line"
            exit 0
          fi
          echo "all-green: FAIL $line"
          echo "::error title=all-green::$line"
          exit 1
