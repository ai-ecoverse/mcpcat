name: Binaries

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Stamp release version
        run: npm version "${TAG#v}" --no-git-tag-version
        env:
          TAG: ${{ inputs.tag }}

      - run: npm ci

      - name: Build and pack
        run: |
          npm run build
          npm pack
          mv ai-ecoverse-mcpcat-*.tgz "mcpcat-${TAG#v}.tgz"
        env:
          TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcpcat-bundle
          path: "mcpcat-*.tgz"

  test-installer:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-with-node
            os: ubuntu-latest
            has_node: true
          - name: ubuntu-no-node
            os: ubuntu-latest
            has_node: false
          - name: macos-with-node
            os: macos-latest
            has_node: true
          - name: macos-no-node
            os: macos-latest
            has_node: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: matrix.has_node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: mcpcat-bundle
          path: assets

      - name: Build SHA256SUMS
        run: cd assets && sha256sum * > SHA256SUMS

      - name: Hide system node
        if: "!matrix.has_node"
        run: |
          mkdir -p "$HOME/.local/share/mcpcat"
          echo "Hiding node from PATH"
          sudo rm -f /usr/local/bin/node /usr/bin/node 2>/dev/null || true
          for d in /opt/hostedtoolcache/node /usr/local/n; do
            sudo rm -rf "$d" 2>/dev/null || true
          done
          hash -r 2>/dev/null || true
          if command -v node >/dev/null 2>&1; then
            echo "WARNING: node still on PATH at $(command -v node)"
          else
            echo "node removed from PATH"
          fi

      - name: Run installer test
        run: sh test/integration/test-install.sh assets "${TAG#v}"
        env:
          TAG: ${{ inputs.tag }}

      - name: Verify node was NOT downloaded when pre-installed
        if: matrix.has_node
        run: |
          if [ -d "$HOME/.local/share/mcpcat/node" ]; then
            echo "FAIL: node was downloaded even though it was on PATH" >&2
            exit 1
          fi
          echo "OK: used system node, no download"

  test-installer-alpine:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine-with-nodejs
            install_node: true
          - name: alpine-no-node
            install_node: false
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: mcpcat-bundle
          path: assets

      - name: Install dependencies
        run: apk add --no-cache python3 tar xz

      - name: Install nodejs (alpine)
        if: matrix.install_node
        run: apk add --no-cache nodejs

      - name: Build SHA256SUMS
        run: cd assets && sha256sum * > SHA256SUMS

      - name: Run installer test (with node)
        if: matrix.install_node
        run: sh test/integration/test-install.sh assets "${TAG#v}"
        env:
          TAG: ${{ inputs.tag }}

      - name: Verify musl rejection (no node)
        if: "!matrix.install_node"
        run: |
          if SLICC_INSTALL_BASE_URL="http://dummy" sh install.sh 2>err.txt; then
            echo "FAIL: should have exited 1 on musl without node" >&2
            exit 1
          fi
          if grep -q "apk add nodejs" err.txt; then
            echo "OK: musl rejection message shown"
            cat err.txt
          else
            echo "FAIL: expected apk hint" >&2
            cat err.txt >&2
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: shellcheck -s sh install.sh

  attach:
    needs: [package, test-installer, test-installer-alpine, shellcheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: mcpcat-bundle
          path: release

      - name: Prepare release assets
        run: |
          cp install.sh release/
          cd release && sha256sum mcpcat-*.tgz > SHA256SUMS

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          gh release upload "$TAG" release/* --clobber

      - name: Promote to latest if highest semver with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          THIS_VER="${TAG#v}"

          HIGHEST="$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.assets | length > 1) | select(.prerelease | not) | select(.draft | not) | .tag_name | ltrimstr("v")] + ["'"$THIS_VER"'"] | sort_by(split(".") | map(tonumber)) | last')"

          if [ "$HIGHEST" = "$THIS_VER" ]; then
            echo "Promoting $TAG to latest (highest semver with assets)"
            gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false --latest
          else
            echo "Not promoting $TAG: $HIGHEST is higher. Clearing prerelease only."
            gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false
          fi

  mark-failed:
    if: failure()
    needs: [attach]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --prerelease
