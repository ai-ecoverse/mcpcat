name: Binaries

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: '24'
  # renovate: datasource=docker depName=alpine
  ALPINE_IMAGE: alpine:3.24.2

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Shellcheck
        run: shellcheck -s sh install.sh test/integration/test-install.sh test/integration/hide-node.sh

      - name: Fetch the published npm tarball
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for _ in $(seq 1 30); do
            npm view "@ai-ecoverse/mcpcat@$version" version >/dev/null 2>&1 && break
            sleep 10
          done
          mkdir assets
          npm pack "@ai-ecoverse/mcpcat@$version" --pack-destination assets
          mv "assets/ai-ecoverse-mcpcat-$version.tgz" "assets/mcpcat-$version.tgz"
          cd assets && sha256sum "mcpcat-$version.tgz" | tee SHA256SUMS
        env:
          TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcpcat-bundle
          path: "assets/mcpcat-*.tgz"

      - name: Installer test, ubuntu with node
        run: |
          set -o pipefail
          sh test/integration/test-install.sh assets "${TAG#v}" 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -qx 'All installer tests passed.' "$RUNNER_TEMP/install.log" || { echo "installer: FAIL — test-install.sh printed no verdict"; exit 1; }
        env:
          TAG: ${{ inputs.tag }}
          EXPECT_MANAGED_NODE: '0'

      - name: Hide system node
        run: sh test/integration/hide-node.sh

      - name: Installer test, ubuntu without node
        run: |
          set -o pipefail
          sh test/integration/test-install.sh assets "${TAG#v}" 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -qx 'All installer tests passed.' "$RUNNER_TEMP/install.log" || { echo "installer: FAIL — test-install.sh printed no verdict"; exit 1; }
        env:
          TAG: ${{ inputs.tag }}
          EXPECT_MANAGED_NODE: '1'

      - name: Installer test, alpine with nodejs
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/w" -w /w -e TAG -e EXPECT_MANAGED_NODE=0 "$ALPINE_IMAGE" sh -euc '
            apk add --no-cache python3 tar xz nodejs >/dev/null
            sh test/integration/test-install.sh assets "${TAG#v}"
          ' 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -qx 'All installer tests passed.' "$RUNNER_TEMP/install.log" || { echo "installer: FAIL — test-install.sh printed no verdict"; exit 1; }
        env:
          TAG: ${{ inputs.tag }}

      - name: Installer test, alpine without node (musl rejection)
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$ALPINE_IMAGE" sh -euc '
            if SLICC_INSTALL_BASE_URL="http://dummy" sh install.sh 2>/tmp/err.txt; then
              echo "FAIL: should have exited 1 on musl without node" >&2
              exit 1
            fi
            if grep -q "apk add nodejs" /tmp/err.txt; then
              echo "OK: musl rejection message shown"
              cat /tmp/err.txt
            else
              echo "FAIL: expected apk hint" >&2
              cat /tmp/err.txt >&2
              exit 1
            fi
          '

  test-installer-macos:
    needs: package
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: mcpcat-bundle
          path: assets

      - name: Build SHA256SUMS
        run: cd assets && shasum -a 256 -- * > SHA256SUMS

      - name: Installer test, macOS with node
        run: |
          set -o pipefail
          sh test/integration/test-install.sh assets "${TAG#v}" 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -qx 'All installer tests passed.' "$RUNNER_TEMP/install.log" || { echo "installer: FAIL — test-install.sh printed no verdict"; exit 1; }
        env:
          TAG: ${{ inputs.tag }}
          EXPECT_MANAGED_NODE: '0'

      - name: Hide system node
        run: sh test/integration/hide-node.sh

      - name: Installer test, macOS without node
        run: |
          set -o pipefail
          sh test/integration/test-install.sh assets "${TAG#v}" 2>&1 | tee "$RUNNER_TEMP/install.log"
          grep -qx 'All installer tests passed.' "$RUNNER_TEMP/install.log" || { echo "installer: FAIL — test-install.sh printed no verdict"; exit 1; }
        env:
          TAG: ${{ inputs.tag }}
          EXPECT_MANAGED_NODE: '1'

  create-release:
    if: github.ref == 'refs/heads/main'
    needs: [package, test-installer-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: mcpcat-bundle
          path: release

      - name: Prepare release assets
        run: |
          cp install.sh release/
          cd release && sha256sum mcpcat-*.tgz > SHA256SUMS

      - name: Attach the assets to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease
          else
            gh release create "$TAG" release/* \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              --prerelease
          fi

      - name: Promote to latest if highest semver with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          THIS_VER="${TAG#v}"

          HIGHEST="$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.assets | length > 1) | select(.prerelease | not) | select(.draft | not) | .tag_name | ltrimstr("v")] + ["'"$THIS_VER"'"] | sort_by(split(".") | map(tonumber)) | last')"

          if [ "$HIGHEST" = "$THIS_VER" ]; then
            echo "Promoting $TAG to latest (highest semver with assets)"
            gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false --latest
          else
            echo "Not promoting $TAG: $HIGHEST is higher. Clearing prerelease only."
            gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease=false
          fi

  mark-failed:
    if: failure() && github.ref == 'refs/heads/main'
    needs: [create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create prerelease on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG exists, ensuring it stays as prerelease"
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease
          else
            echo "Creating $TAG as prerelease (asset build failed)"
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Installer assets failed to build. See workflow run for details." \
              --verify-tag \
              --prerelease
          fi
