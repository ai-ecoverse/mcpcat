name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-release.yml@v1.21.1
    with:
      # renovate: datasource=node-version depName=node versioning=node
      node-version: '24'
      chromium: false
    secrets: inherit

  detect-tag:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Find release tag
        id: tag
        run: |
          git fetch --tags --force
          TAG=$(git tag --points-at HEAD 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: ${TAG:-none}"

  verify:
    name: release / verify on npm
    needs: detect-tag
    if: github.ref == 'refs/heads/main' && needs.detect-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.detect-tag.outputs.tag }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # renovate: datasource=node-version depName=node versioning=node
          node-version: '24'

      - name: The registry's bytes, the SLSA subject, provenance on main and gitHead = tag
        run: |
          version="${TAG#v}"
          line=$(node scripts/cert-review/published.mjs --version "$version") && ok=1 || ok=0
          { echo '```'; echo "$line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$line"
          [ "$ok" = 1 ] && exit 0
          echo "::error title=supply-chain alert: $TAG on npm::$line"
          {
            echo "The post-publish check of @ai-ecoverse/mcpcat@$version failed in $RUN_URL."
            echo
            echo '```'
            echo "$line"
            echo '```'
            echo
            echo "Treat this as a supply-chain alert: the bytes on npm, their SLSA provenance or their gitHead do not match $TAG on main."
          } > "$RUNNER_TEMP/alert.md"
          gh issue create --title "supply-chain alert: @ai-ecoverse/mcpcat@$version on npm failed verification" --body-file "$RUNNER_TEMP/alert.md"
          exit 1

  binaries:
    needs: detect-tag
    if: github.ref == 'refs/heads/main' && needs.detect-tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.detect-tag.outputs.tag }}
    secrets: inherit
