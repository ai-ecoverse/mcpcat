name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/node-release.yml@v1.30.10
    with:
      # renovate: datasource=node-version depName=node versioning=node
      node-version: '26'
      chromium: false
    secrets: inherit

  detect-tag:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Find release tag
        id: tag
        run: |
          git fetch --tags --force
          TAG=$(git tag --points-at HEAD 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: ${TAG:-none}"

  binaries:
    needs: detect-tag
    if: github.ref == 'refs/heads/main' && needs.detect-tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.detect-tag.outputs.tag }}
    secrets: inherit
