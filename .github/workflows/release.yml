name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: '24'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: release / tag
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CERT_RUNNER || 'cloud-run-bench' }}
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      LEFTHOOK: '0'
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: semantic-release tags and drafts the release notes, npm publishing is off
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The tag on this commit
        id: tag
        run: |
          git fetch --tags --force
          version=$(git tag --points-at HEAD 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release tag: ${version:+v$version}${version:-none}"

  pack:
    name: release / pack
    needs: tag
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LEFTHOOK: '0'
      VERSION: ${{ needs.tag.outputs.version }}
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      file: ${{ steps.pack.outputs.file }}
      artifact: mcpcat-tarball-${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pack v${{ needs.tag.outputs.version }} from its tag
        id: pack
        run: node scripts/cert-review/pack.mjs --version "$VERSION" --out "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcpcat-tarball-${{ needs.tag.outputs.version }}
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/*.tgz.sha256
            ${{ runner.temp }}/pack/pack.json
          if-no-files-found: error

  cert:
    name: cert-review
    needs: [tag, pack]
    permissions:
      actions: read
      contents: write
      issues: write
      statuses: write
    uses: ./.github/workflows/cert-review.yml
    with:
      version: ${{ needs.tag.outputs.version }}
      tarball: ${{ needs.pack.outputs.artifact }}
      sha256: ${{ needs.pack.outputs.sha256 }}
    secrets: inherit

  publish:
    name: release / publish
    needs: [tag, pack, cert]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.cert.outputs.verdict == 'certified' &&
      needs.cert.outputs.sha256 == needs.pack.outputs.sha256
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      sha256: ${{ needs.cert.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.pack.outputs.artifact }}
          path: ${{ runner.temp }}/pack

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-review-record-${{ needs.tag.outputs.version }}
          path: ${{ runner.temp }}/record

      - name: Publish the certified bytes, with provenance
        env:
          TGZ: ${{ runner.temp }}/pack/${{ needs.pack.outputs.file }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
        run: node scripts/cert-review/publish.mjs --tarball "$TGZ" --record "$RUNNER_TEMP/record/record.json" --sha256 "$SHA256"

  unpublished:
    name: release / not published
    needs: [tag, pack, cert, publish]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.tag.outputs.version != '' && (
        needs.publish.result == 'failure' || !(
          needs.cert.outputs.verdict == 'certified' &&
          needs.cert.outputs.sha256 == needs.pack.outputs.sha256
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.tag.outputs.version }}
      LINE: ${{ needs.cert.outputs.line }}
      PACK: ${{ needs.pack.result }}
      CERT: ${{ needs.cert.result }}
      PUBLISH: ${{ needs.publish.result }}
    steps:
      - name: v${{ needs.tag.outputs.version }} stays tagged and unpublished
        run: |
          line="${LINE:-cert-ci: FAIL @ai-ecoverse/mcpcat@$VERSION: no cert-review line (pack $PACK, cert-review $CERT)}"
          [ "$PUBLISH" != failure ] || line="the publish job failed after: $line"
          { echo '```'; echo "not published: $line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release edit "v$VERSION" --draft=false --prerelease --latest=false > /dev/null
            echo "v$VERSION is a prerelease with the cert-review line in its notes"
          fi
          echo "::error title=v$VERSION not published::$line"
          exit 1

  verify:
    name: release / verify on npm
    needs: [tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: SLSA provenance, npm integrity and gitHead against the certified sha256
        env:
          SHA256: ${{ needs.publish.outputs.sha256 }}
        run: |
          line=$(node scripts/cert-review/published.mjs --version "$VERSION" --sha256 "$SHA256") && ok=1 || ok=0
          { echo '```'; echo "$line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$line"
          [ "$ok" = 1 ] || { echo "::error title=v$VERSION on npm::$line"; exit 1; }

      - name: Published but not verified, so the release is a visible prerelease
        if: failure()
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release edit "v$VERSION" --draft=false --prerelease --latest=false > /dev/null
            echo "v$VERSION is a prerelease: it is on npm, but the post-publish checks failed"
          fi

  binaries:
    needs: [tag, publish, verify]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: v${{ needs.tag.outputs.version }}
      sha256: ${{ needs.publish.outputs.sha256 }}
    secrets: inherit
